<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Notes App</title>

    <style>

        :root {

            --bg-color: #f4f6f9;

            --sidebar-bg: #ffffff;

            --text-color: #333333;

            --accent-color: #4a90e2;

            --border-color: #e1e4e8;

            --delete-color: #e74c3c;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        }


        body {

            display: flex;

            height: 100vh;

            background-color: var(--bg-color);

            color: var(--text-color);

        }


        /* Sidebar Styling */

        .sidebar {

            width: 300px;

            background-color: var(--sidebar-bg);

            border-right: 1px solid var(--border-color);

            display: flex;

            flex-direction: column;

        }


        .sidebar-header {

            padding: 20px;

            border-bottom: 1px solid var(--border-color);

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .btn {

            padding: 8px 14px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;

            transition: background 0.2s;

        }


        .btn-main {

            background-color: var(--accent-color);

            color: white;

        }


        .btn-main:hover {

            background-color: #357abd;

        }


        .notes-list {

            flex: 1;

            overflow-y: auto;

            padding: 10px;

        }


        .note-item {

            padding: 15px;

            background: var(--bg-color);

            border-radius: 6px;

            margin-bottom: 10px;

            cursor: pointer;

            position: relative;

            transition: transform 0.1s;

        }


        .note-item:hover {

            transform: translateY(-2px);

        }


        .note-item.active {

            border-left: 4px solid var(--accent-color);

            background: #eef5fc;

        }


        .note-item h4 {

            font-size: 14px;

            margin-bottom: 5px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .note-item p {

            font-size: 12px;

            color: #666;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .delete-btn {

            position: absolute;

            right: 10px;

            top: 15px;

            background: none;

            border: none;

            color: var(--delete-color);

            cursor: pointer;

            font-weight: bold;

            display: none;

        }


        .note-item:hover .delete-btn {

            display: block;

        }


        /* Editor Area */

        .editor-container {

            flex: 1;

            display: flex;

            flex-direction: column;

            padding: 30px;

            background-color: #ffffff;

        }


        .editor-header {

            margin-bottom: 20px;

            display: flex;

            gap: 15px;

        }


        .note-title-input {

            flex: 1;

            font-size: 24px;

            font-weight: 700;

            border: none;

            outline: none;

            border-bottom: 2px solid transparent;

        }


        .note-title-input:focus {

            border-bottom-color: var(--border-color);

        }


        .note-textarea {

            flex: 1;

            font-size: 16px;

            line-height: 1.6;

            border: none;

            outline: none;

            resize: none;

            color: #444;

        }


        .placeholder-text {

            display: flex;

            align-items: center;

            justify-content: center;

            flex: 1;

            color: #999;

            font-style: italic;

        }

    </style>

</head>

<body>


    <!-- Sidebar -->

    <div class="sidebar">

        <div class="sidebar-header">

            <h3>My Notes</h3>

            <button class="btn btn-main" id="add-note-btn">+ New</button>

        </div>

        <div class="notes-list" id="notes-list">

            <!-- Dynamic notes injected here -->

        </div>

        <div style="padding: 15px; border-top: 1px solid var(--border-color);">

            <button class="btn" id="export-btn" style="width: 100%; background: #eee;">Export Backup (.json)</button>

        </div>

    </div>


    <!-- Main Editor -->

    <div class="editor-container" id="editor-container" style="display: none;">

        <div class="editor-header">

            <input type="text" class="note-title-input" id="note-title" placeholder="Untitled Note">

        </div>

        <textarea class="note-textarea" id="note-body" placeholder="Start typing your thoughts..."></textarea>

    </div>


    <!-- Placeholder when no note is selected -->

    <div class="placeholder-text" id="placeholder-text">

        Select a note or create a new one to get started.

    </div>


    <script>

        // DOM Elements

        const notesList = document.getElementById('notes-list');

        const addNoteBtn = document.getElementById('add-note-btn');

        const exportBtn = document.getElementById('export-btn');

        const editorContainer = document.getElementById('editor-container');

        const placeholderText = document.getElementById('placeholder-text');

        const noteTitleInput = document.getElementById('note-title');

        const noteBodyInput = document.getElementById('note-body');


        // Application State

        let notes = JSON.parse(localStorage.getItem('local-notes')) || [];

        let activeNoteId = null;


        // Functions

        function saveToLocalStorage() {

            localStorage.setItem('local-notes', JSON.stringify(notes));

        }


        function renderNotesList() {

            notesList.innerHTML = '';

            

            // Sort by last modified date (newest first)

            notes.sort((a, b) => b.updatedAt - a.updatedAt);


            notes.forEach(note => {

                const noteItem = document.createElement('div');

                noteItem.classList.add('note-item');

                if (note.id === activeNoteId) noteItem.classList.add('active');

                

                noteItem.innerHTML = `

                    <h4>${note.title.trim() || 'Untitled Note'}</h4>

                    <p>${note.body.trim() || 'No additional content...'}</p>

                    <button class="delete-btn" data-id="${note.id}">&times;</button>

                `;


                // Select note on click

                noteItem.addEventListener('click', (e) => {

                    if (e.target.classList.contains('delete-btn')) return;

                    selectNote(note.id);

                });


                // Delete note button

                noteItem.querySelector('.delete-btn').addEventListener('click', (e) => {

                    e.stopPropagation();

                    deleteNote(note.id);

                });


                notesList.appendChild(noteItem);

            });

        }


        function createNewNote() {

            const newNote = {

                id: Date.now().toString(),

                title: '',

                body: '',

                updatedAt: Date.now()

            };

            notes.unshift(newNote);

            saveToLocalStorage();

            selectNote(newNote.id);

        }


        function selectNote(id) {

            activeNoteId = id;

            const note = notes.find(n => n.id === id);

            

            if (note) {

                noteTitleInput.value = note.title;

                noteBodyInput.value = note.body;

                

                placeholderText.style.display = 'none';

                editorContainer.style.display = 'flex';

            }

            renderNotesList();

        }


        function updateActiveNote() {

            if (!activeNoteId) return;

            

            const note = notes.find(n => n.id === activeNoteId);

            if (note) {

                note.title = noteTitleInput.value;

                note.body = noteBodyInput.value;

                note.updatedAt = Date.now();

                

                saveToLocalStorage();

                // Re-render list items without stripping editor focus

                const items = document.querySelectorAll('.note-item');

                renderNotesList();

            }

        }


        function deleteNote(id) {

            notes = notes.filter(n => n.id !== id);

            saveToLocalStorage();

            

            if (activeNoteId === id) {

                activeNoteId = null;

                editorContainer.style.display = 'none';

                placeholderText.style.display = 'flex';

            }

            renderNotesList();

        }


        function exportNotes() {

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));

            const downloadAnchor = document.createElement('a');

            downloadAnchor.setAttribute("href", dataStr);

            downloadAnchor.setAttribute("download", "my_notes_backup.json");

            document.body.appendChild(downloadAnchor);

            downloadAnchor.click();

            downloadAnchor.remove();

        }


        // Event Listeners

        addNoteBtn.addEventListener('click', createNewNote);

        noteTitleInput.addEventListener('input', updateActiveNote);

        noteBodyInput.addEventListener('input', updateActiveNote);

        exportBtn.addEventListener('click', exportNotes);


        // Initial Load

        renderNotesList();

    </script>

</body>

</html>
